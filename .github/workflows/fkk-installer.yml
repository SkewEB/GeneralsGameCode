name: FKK Installer

# Builds FKK-Setup.exe from the GeneralsMD win32+t+e artifact of a GenCI run on main
# and publishes it as the latest GitHub release. The FKK starter checks
# releases/latest/download/fkk-version.txt on every start and auto-updates.

permissions:
  contents: write
  actions: read

on:
  workflow_run:
    workflows: [GenCI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: GenCI run id to package
        required: true

concurrency:
  group: fkk-installer
  cancel-in-progress: false

jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: windows-latest
    steps:
      - name: Resolve source run
        id: src
        shell: pwsh
        run: |
          # inputs come in via env, never pasted into the script text
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $runId = $env:INPUT_RUN_ID
            if ($runId -notmatch '^[0-9]+$') { throw "run_id must be a number" }
            $run = gh api repos/$env:REPO/actions/runs/$runId | ConvertFrom-Json
            # only package push builds of main (replay checks fail on the fork, so no conclusion check)
            if ($run.head_branch -ne "main" -or $run.event -ne "push" -or $run.head_repository.full_name -ne $env:REPO) {
              throw "run $runId is not a push build of main"
            }
            $sha = $run.head_sha
          } else {
            $runId = $env:WR_RUN_ID
            $sha = $env:WR_HEAD_SHA
          }
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "unexpected sha" }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      # installer sources come from the current main, the game binaries from the source run
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download game build
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: GeneralsMD-win32+t+e
          path: game
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build starter
        shell: pwsh
        run: |
          Get-ChildItem game | Format-Table Name, Length
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /win32icon:fkk\installer\fkk.ico `
            /out:fkk\installer\FKK-Starter.exe `
            /resource:fkk\installer\fkk-logo.png,fkk-logo.png `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll fkk\installer\FKKStarter.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        id: setup
        shell: pwsh
        run: |
          $shortSha = "${{ steps.src.outputs.sha }}".Substring(0, 7)
          $version = "0.1.${{ github.run_number }}"
          $tag = "fkk-v$version"
          New-Item -ItemType Directory -Force fkk\installer\output | Out-Null
          Set-Content -NoNewline -Path fkk\installer\output\fkk-version.txt -Value "$shortSha"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=$version" "/DGameDir=$PWD\game" "/DStarterExe=$PWD\fkk\installer\FKK-Starter.exe" fkk\installer\fkk.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # checksum for the starter's update check
          $hash = (Get-FileHash -Algorithm SHA256 fkk\installer\output\FKK-Setup.exe).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path fkk\installer\output\FKK-Setup.exe.sha256 -Value "$hash  FKK-Setup.exe"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path game\generalszh.pdb -DestinationPath fkk\installer\output\generalszh-pdb.zip
          gh release create "${{ steps.setup.outputs.tag }}" `
            fkk\installer\output\FKK-Setup.exe fkk\installer\output\FKK-Setup.exe.sha256 fkk\installer\output\fkk-version.txt fkk\installer\output\generalszh-pdb.zip `
            --repo ${{ github.repository }} `
            --target "${{ steps.src.outputs.sha }}" `
            --title "FKK Edition ${{ steps.setup.outputs.version }}" `
            --notes "Installer: FKK-Setup.exe. Build ${{ steps.src.outputs.sha }}." `
            --latest
